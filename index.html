  <style>
    .hero { display: grid; grid-template-columns: 1fr 1fr; min-height: 500px; border-bottom: 1px solid var(--stone); }
    .hero-left { padding: 4rem 3rem 4rem 2.5rem; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--stone); }
    .hero-eyebrow { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rust); margin-bottom: 1.25rem; font-weight: 500; }
    .hero-left h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4vw, 3rem); line-height: 1.08; color: var(--ink); margin-bottom: 1.25rem; }
    .hero-left h1 em { font-style: italic; color: var(--moss); }
    .hero-left > p { color: var(--bark); font-size: 1rem; line-height: 1.7; max-width: 400px; margin-bottom: 2rem; font-weight: 300; }
    .hero-btns { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .hero-right { background: var(--mist); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
    .hero-img-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .stat-strip { display: flex; }
    .stat-cell { flex: 1; padding: 1rem; border-top: 1px solid var(--stone); border-right: 1px solid var(--stone); background: var(--cream); }
    .stat-cell:last-child { border-right: none; }
    .stat-cell .num { font-family: var(--serif); font-size: 1.5rem; color: var(--moss); }
    .stat-cell .lbl { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bark); margin-top: 0.1rem; }

    .pillars { padding: 3.5rem 2.5rem; border-bottom: 1px solid var(--stone); }
    .pillars-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--stone); }
    .pillar { padding: 2rem 1.75rem; border-right: 1px solid var(--stone); }
    .pillar:last-child { border-right: none; }
    .pillar-num { font-family: var(--serif); font-size: 2.2rem; color: var(--stone); line-height: 1; margin-bottom: 0.75rem; }
    .pillar h3 { font-family: var(--serif); font-size: 1.1rem; color: var(--ink); margin-bottom: 0.5rem; }
    .pillar p { font-size: 0.87rem; color: var(--bark); line-height: 1.65; font-weight: 300; }
    .pillar-link { display: inline-block; margin-top: 1rem; font-size: 0.73rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--moss); border-bottom: 1px solid var(--moss); padding-bottom: 1px; transition: opacity 0.2s; }
    .pillar-link:hover { opacity: 0.7; }

    .picks { padding: 3.5rem 2.5rem; border-bottom: 1px solid var(--stone); background: var(--warm); }
    .picks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--stone); border: 1px solid var(--stone); }
    .pick-card { background: var(--cream); padding: 1.75rem; }
    .pick-badge { display: inline-block; background: #eef4ee; color: #2d4a2e; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.65rem; margin-bottom: 1rem; font-weight: 500; }
    .pick-card h3 { font-family: var(--serif); font-size: 1.05rem; color: var(--ink); margin-bottom: 0.5rem; line-height: 1.3; }
    .pick-card > p { font-size: 0.85rem; color: var(--bark); line-height: 1.6; font-weight: 300; margin-bottom: 1rem; }
    .affiliate-note { font-size: 0.68rem; color: var(--bark); margin-top: 0.6rem; font-style: italic; display: block; }

    .posts { padding: 3.5rem 2.5rem; border-bottom: 1px solid var(--stone); }
    .posts-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; border: 1px solid var(--stone); }
    .post-featured { padding: 2rem; border-right: 1px solid var(--stone); }
    .post-thumb { height: 180px; background: var(--mist); margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: center; }
    .post-col { display: flex; flex-direction: column; border-right: 1px solid var(--stone); }
    .post-col:last-child { border-right: none; }
    .post-sm { padding: 1.5rem; border-bottom: 1px solid var(--stone); flex: 1; display: flex; flex-direction: column; }
    .post-sm:last-child { border-bottom: none; }
    .post-cat { font-size: 0.67rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rust); margin-bottom: 0.4rem; font-weight: 500; }
    .post-title { font-family: var(--serif); color: var(--ink); line-height: 1.25; margin-bottom: 0.5rem; }
    .post-featured .post-title { font-size: 1.45rem; }
    .post-sm .post-title { font-size: 0.97rem; }
    .post-desc { font-size: 0.84rem; color: var(--bark); line-height: 1.6; font-weight: 300; flex: 1; }
    .post-sm .read-more { margin-top: 0.9rem; }

    .newsletter { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--stone); }
    .nl-left { padding: 3.5rem 2.5rem; border-right: 1px solid var(--stone); background: var(--moss); }
    .nl-left .sec-label { color: rgba(255,255,255,0.45); }
    .nl-left .sec-label::after { background: rgba(255,255,255,0.2); }
    .nl-left h2 { font-family: var(--serif); font-size: 2rem; color: #fff; line-height: 1.15; margin-bottom: 0.75rem; }
    .nl-left > p { color: rgba(255,255,255,0.72); font-size: 0.92rem; font-weight: 300; line-height: 1.7; }
    .nl-right { padding: 3.5rem 2.5rem; background: var(--mist); display: flex; flex-direction: column; justify-content: center; }
    .nl-right > p { font-size: 0.85rem; color: var(--bark); margin-bottom: 1.5rem; font-weight: 300; line-height: 1.6; }
    .form-col { display: flex; flex-direction: column; gap: 0.6rem; }
    .form-col input { padding: 0.7rem 1rem; border: 1px solid var(--stone); background: var(--cream); font-family: var(--sans); font-size: 0.88rem; color: var(--ink); outline: none; transition: border-color 0.2s; }
    .form-col input:focus { border-color: var(--moss); }
    .form-col input::placeholder { color: #b0a090; }
    .form-col button { background: var(--rust); color: #fff; border: none; padding: 0.8rem; font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .form-col button:hover { background: #9e4e2e; }
    .fine { font-size: 0.68rem; color: var(--bark); margin-top: 0.6rem; font-weight: 300; }
    .fine a { color: var(--bark); border-bottom: 1px solid var(--bark); }
  </style>

  <section id="product-carousel">
    <style>
      #product-carousel {
        background: #fffdf9;
        padding: 56px 40px 64px;
        border-bottom: 1px solid #e8e4db;
      }
      #product-carousel .pc-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 32px;
      }
      #product-carousel .pc-heading {
        font-size: 1.5rem;
        font-weight: 600;
        font-variant: small-caps;
        letter-spacing: .06em;
        color: #3d5a3e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #product-carousel .pc-nav {
        display: flex;
        gap: 10px;
      }
      #product-carousel .pc-arrow {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px solid #e8e4db;
        background: #fffdf9;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s, border-color .2s, transform .15s;
        flex-shrink: 0;
      }
      #product-carousel .pc-arrow:hover {
        background: #3d5a3e;
        border-color: #3d5a3e;
      }
      #product-carousel .pc-arrow:hover svg path { stroke: #fffdf9; }
      #product-carousel .pc-arrow:active { transform: scale(.93); }
      #product-carousel .pc-arrow svg path { stroke: #1a1a18; transition: stroke .2s; }
      #product-carousel .pc-wrapper {
        overflow: hidden;
        position: relative;
      }
      #product-carousel .pc-track {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding-bottom: 4px;
      }
      #product-carousel .pc-track::-webkit-scrollbar { display: none; }
      #product-carousel .pc-card {
        background: #fff;
        border: 1.5px solid #e8e4db;
        border-radius: 12px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        flex: 0 0 calc(25% - 15px);
        scroll-snap-align: start;
        transition: transform .22s ease, box-shadow .22s ease;
        display: flex;
        flex-direction: column;
      }
      #product-carousel .pc-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 28px rgba(0,0,0,.10);
      }
      #product-carousel .pc-img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
        background: #f0ede7;
      }
      #product-carousel .pc-body {
        padding: 16px 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      #product-carousel .pc-cat {
        font-size: .75rem;
        color: #7a6a52;
        text-transform: uppercase;
        letter-spacing: .07em;
        font-weight: 500;
      }
      #product-carousel .pc-name {
        font-size: .975rem;
        font-weight: 700;
        color: #1a1a18;
        line-height: 1.35;
        margin-top: 2px;
      }
      #product-carousel .pc-cta {
        margin-top: auto;
        padding-top: 12px;
        font-size: .82rem;
        font-weight: 600;
        color: #b85c38;
        letter-spacing: .02em;
      }
      @media (max-width: 1024px) {
        #product-carousel .pc-card { flex: 0 0 calc(50% - 10px); }
      }
      @media (max-width: 600px) {
        #product-carousel { padding: 40px 20px 52px; }
        #product-carousel .pc-card { flex: 0 0 100%; }
      }
    </style>
